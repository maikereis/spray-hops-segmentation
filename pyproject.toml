[project]
name = "spray-hops-segmentation"
version = "0.1.0"
description = "Semantic segmentation of soil paths between hop rows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.19.0",
    "segmentation-models-pytorch>=0.3.4",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.10.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scikit-image>=0.24.0",
    "tqdm>=4.66.0",
    "roboflow>=1.1.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]
